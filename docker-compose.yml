services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8000"   # локальная отладка
    networks: [internal, n8n_n8n_net]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_n8n_net
      - traefik.http.routers.guideplatform.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.guideplatform.entrypoints=websecure
      - traefik.http.routers.guideplatform.tls.certresolver=mytlschallenge
      - traefik.http.services.guideplatform.loadbalancer.server.port=8000
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  n8n_n8n_net:
    external: true
