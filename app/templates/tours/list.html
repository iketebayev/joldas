{% extends "base.html" %}
{% block title %}{{ t('tour.catalog_title') }}{% endblock %}
{% block content %}
<h1>{{ t('tour.catalog_title') }}</h1>
<p class="muted">{{ t('tour.catalog_subtitle') }}</p>
<form class="card" method="get" action="/tours" style="margin:16px 0">
  <div class="grid g2" style="gap:10px">
    <div><label for="site">{{ t('guides.f_site') }}</label>
      <select id="site" name="site"><option value="">{{ t('common.all') }}</option>
        {% for s in sites %}<option value="{{ s.id }}" {{ 'selected' if f.site == s.id }}>{{ name_of(s) }}</option>{% endfor %}</select></div>
    <div><label for="language">{{ t('guides.f_language') }}</label>
      <select id="language" name="language"><option value="">{{ t('common.all') }}</option>
        {% for c in guide_langs %}<option value="{{ c }}" {{ 'selected' if f.language == c }}>{{ t('lang.' ~ c) }}</option>{% endfor %}</select></div>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn small">{{ t('common.filter') }}</button>
    <a class="btn small ghost" href="/tours">{{ t('common.reset') }}</a></div>
</form>
{% include "tours/_cards.html" %}
{% endblock %}
